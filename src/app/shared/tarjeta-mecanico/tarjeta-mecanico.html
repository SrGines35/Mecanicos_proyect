<button class="tarjeta-mec" type="button" (click)="alSeleccionar()">
  <div class="tarjeta-mec__avatar">{{ iniciales() }}</div>

  <div class="tarjeta-mec__info">
    <div class="tarjeta-mec__fila">
      <span class="tarjeta-mec__nombre">{{ mecanico().nombre }}</span>
      <span class="etiqueta etiqueta--{{ mecanico().estado }}">{{ textoEstado() }}</span>
    </div>

    <div class="tarjeta-mec__especialidades">{{ especialidadesTexto() }}</div>

    <div class="tarjeta-mec__datos">
      <span class="tarjeta-mec__dato">
        &#9733; {{ mecanico().calificacion | number: '1.1-1' }}
        <span class="texto-suave">({{ mecanico().totalServicios }})</span>
      </span>
      <span class="tarjeta-mec__dato">{{ mecanico().distanciaKm | distancia }}</span>
      <span class="tarjeta-mec__dato">~{{ mecanico().tiempoEstimadoMin }} min</span>
    </div>
  </div>

  <div class="tarjeta-mec__tarifa">
    <span class="tarjeta-mec__monto">${{ mecanico().tarifaBase }}</span>
    <span class="tarjeta-mec__desde">desde</span>
  </div>
</button>
