<header class="barra">
  @if (mostrarRegresar()) {
    <button class="barra__icono" type="button" aria-label="Regresar" (click)="regresar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </svg>
    </button>
  }

  <div class="barra__texto">
    <span class="barra__titulo">{{ titulo() }}</span>
    @if (sesion.usuario(); as usuario) {
      <span class="barra__usuario">{{ usuario.nombre }}</span>
    }
  </div>

  <button class="barra__salir" type="button" title="Cerrar sesión" (click)="salir()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
    </svg>
    <span>Salir</span>
  </button>
</header>
