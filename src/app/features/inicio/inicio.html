<section class="portada">
  <span class="portada__marca">MecaGo</span>
  <h1 class="portada__titulo">¿Se te descompuso?</h1>
  <p class="portada__texto">
    Dinos que necesitas y te mandamos al mecanico disponible mas cercano.
  </p>

  <div class="ubicacion">
    <span class="ubicacion__icono">📍</span>
    @if (geo.cargando()) {
      <span class="ubicacion__texto">Buscando tu ubicacion...</span>
    } @else {
      <span class="ubicacion__texto">{{ geo.ubicacionActual().direccion }}</span>
    }
  </div>
</section>

<h2 class="seccion-titulo">¿Que necesitas?</h2>

<div class="servicios">
  @for (servicio of servicios; track servicio.valor) {
    <button
      type="button"
      class="servicio"
      [class.servicio--activo]="servicioSeleccionado()?.valor === servicio.valor"
      (click)="seleccionar(servicio)"
    >
      <span class="servicio__icono">{{ servicio.icono }}</span>
      <span class="servicio__nombre">{{ servicio.nombre }}</span>
      <span class="servicio__desc">{{ servicio.descripcion }}</span>
    </button>
  }
</div>

<div class="acciones">
  <button
    class="boton boton--primario"
    type="button"
    [disabled]="!servicioSeleccionado()"
    (click)="continuar()"
  >
    {{ servicioSeleccionado() ? 'Continuar' : 'Elige un servicio' }}
  </button>

  <button class="boton boton--fantasma" type="button" (click)="verTodos()">
    Ver todos los mecanicos cerca
  </button>
</div>
