<div class="auth-pagina">
  <div class="auth-tarjeta">
    <div class="auth-marca">
      <span class="auth-marca__icono">🔧</span>
      <h1>Oaxicanicos</h1>
      <p class="auth-subtitulo">Encuentra tu solución mecánica</p>
    </div>

    <form class="auth-formulario" (ngSubmit)="iniciarSesion()" #formulario="ngForm">
      <div class="campo">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          autocomplete="email"
          placeholder="tucorreo@gmail.com"
          required
          [pattern]="patronCorreo"
          [ngModel]="correo"
          (ngModelChange)="onCorreoChange($event)"
          #correoInput="ngModel"
        />
        @if (correoInput.invalid && correoInput.touched) {
          <p class="campo__error">Ingrese un correo válido</p>
        }
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <div class="campo-contrasena">
          <input
            id="contrasena"
            name="contrasena"
            [type]="mostrarContrasena() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            [(ngModel)]="contrasena"
          />
          <app-icono-ojo [visible]="mostrarContrasena()" (alternar)="alternarContrasena()" />
        </div>
      </div>

      <p class="auth-alt">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>

      <button type="submit" class="boton-primario" [disabled]="formulario.invalid">
        Iniciar sesión
      </button>

      @if (enviado()) {
        <p class="auth-mensaje">Datos enviados: {{ correo }}</p>
      }
    </form>
  </div>
</div>
