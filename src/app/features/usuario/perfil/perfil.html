<!-- Identidad. El avatar es solo un dibujo: no es foto ni se puede cambiar. -->
<header class="identidad">
  <div class="identidad__avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4" />
      <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
    </svg>
  </div>

  <h1 class="identidad__titulo">Mi perfil</h1>
  <p class="identidad__ayuda">Administra tu información personal</p>
</header>

<section class="bloque">
  <h2 class="bloque__titulo">Información personal</h2>

  <div class="campo">
    <label for="perfil-nombre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
      </svg>
      Nombre
    </label>

    <input
      id="perfil-nombre"
      type="text"
      [(ngModel)]="usuario.nombre"
      [disabled]="!editando">
  </div>

  <div class="campo">
    <label for="perfil-correo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5" />
        <path d="M3.5 7.5l8.5 6 8.5-6" />
      </svg>
      Correo electrónico
    </label>

    <input
      id="perfil-correo"
      type="email"
      [(ngModel)]="usuario.correo"
      [disabled]="!editando">
  </div>

  <div class="campo campo--ultimo">
    <label for="perfil-telefono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.7
                 1.5A16.5 16.5 0 0 1 5 5.2 1.5 1.5 0 0 1 6.5 3.5z" />
      </svg>
      Teléfono
    </label>

    <input
      id="perfil-telefono"
      type="tel"
      [(ngModel)]="usuario.telefono"
      [disabled]="!editando">
  </div>

  @if (!editando) {

    <button
      type="button"
      class="boton-primario"
      (click)="editar()">

      Editar información

    </button>

  }

  @if (editando) {

    <button
      type="button"
      class="boton-primario"
      (click)="guardar()">

      Guardar cambios

    </button>

  }
</section>
