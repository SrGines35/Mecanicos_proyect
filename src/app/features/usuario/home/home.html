<!-- Saludo: dos renglones para darle jerarquia. El nombre es lo que pesa. -->
<header class="saludo">
  <p class="saludo__hola">Hola,</p>
  <h1 class="saludo__nombre">{{ nombreUsuario() }}</h1>
  <p class="saludo__mensaje">¿Necesitas ayuda con tu vehículo?</p>
</header>

<!-- La accion principal. Es lo unico que se puede hacer desde aqui, asi que
     se le da una tarjeta propia y el boton ambar. -->
<section class="bloque accion">
  <svg class="accion__dibujo" viewBox="0 0 120 80" fill="none" aria-hidden="true">
    <path d="M18 54h84" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          opacity="0.28" />
    <path d="M28 54V42l8-12h30l10 12h12a6 6 0 0 1 6 6v6"
          stroke="currentColor" stroke-width="2" stroke-linejoin="round"
          stroke-linecap="round" opacity="0.5" />
    <circle cx="40" cy="56" r="6" stroke="currentColor" stroke-width="2" opacity="0.7" />
    <circle cx="82" cy="56" r="6" stroke="currentColor" stroke-width="2" opacity="0.7" />
    <path d="M60 14v10M53 17.5l3.5 3.5M67 17.5l-3.5 3.5" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" opacity="0.45" />
  </svg>

  <h2 class="bloque__titulo">Pedir un mecánico</h2>

  <p class="accion__texto">
    Dinos dónde estás y qué le pasa a tu carro. Te mostramos los mecánicos
    disponibles más cerca de ti.
  </p>

  <button
    type="button"
    class="boton-primario"
    routerLink="/usuario/solicitar-servicio">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.7 6.3a4 4 0 0 0 5 5l-8.4 8.4a2.4 2.4 0 0 1-3.4-3.4l8.4-8.4a4 4 0
               0 0-5-5l3 3-2 2-3-3a4 4 0 0 1 5.4 1.4z" />
    </svg>

    Solicitar mecánico
  </button>
</section>
